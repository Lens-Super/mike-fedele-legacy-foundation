name: Refresh cropped Deacon JPG
on:
  push:
    paths:
      - '.github/workflows/refresh-deacon.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - name: Convert latest uploaded Deacon image
        run: |
          python - <<'PY'
          from pillow_heif import register_heif_opener
          from PIL import Image, ImageOps
          from pathlib import Path
          register_heif_opener()
          im=Image.open('IMG_20261114_114401.heic')
          ImageOps.exif_transpose(im).convert('RGB').save('deacon-memorial.jpg','JPEG',quality=94,optimize=True)
          Path('.github/workflows/refresh-deacon.yml').unlink()
          PY
      - name: Commit converted photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Deacon JPG from user-cropped original"
          git push
