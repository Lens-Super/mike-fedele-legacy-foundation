name: Convert Deacon photo to JPG
on:
  push:
    paths:
      - '.github/workflows/convert-deacon.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - name: Convert and update memorial
        run: |
          python - <<'PY'
          from pillow_heif import register_heif_opener
          from PIL import Image, ImageOps
          from pathlib import Path
          register_heif_opener()
          original = Path('IMG_20261114_114401.heic')
          im = Image.open(original)
          im = ImageOps.exif_transpose(im).convert('RGB')
          im.save('deacon-memorial.jpg', 'JPEG', quality=94, optimize=True)
          page = Path('pet-tributes.html')
          text = page.read_text()
          assert 'IMG_20261114_114401.heic' in text
          page.write_text(text.replace('IMG_20261114_114401.heic', 'deacon-memorial.jpg'))
          Path('.github/workflows/convert-deacon.yml').unlink()
          PY
      - name: Commit JPG and website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert Deacon HEIC to browser-compatible JPG and update tribute"
          git push
