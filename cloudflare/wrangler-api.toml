name = "mike-fedele-memories-api"
main = "api-worker.js"
compatibility_date = "2026-11-04"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mike-memories"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "mike-memories-originals"

[vars]
SITE_ORIGIN = "https://mikefedelelegacy.org"
TURNSTILE_SITE_KEY = ""
